<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NaaBus - Login</title>

  <style>
    :root {
      --bg-main: #0b0b1a;
      --bg-input: #1a1a2e;
      --primary: #6d28d9;
      --primary-hover: #7c3aed;
      --text-main: #ffffff;
      --text-muted: #cbd5f5;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 40px;
      border-radius: 12px;
      width: 320px;
      box-shadow: 0 0 20px rgba(138, 43, 226, 0.2);
    }

    .title {
      color: #a78bfa;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 14px;
      margin-bottom: 25px;
      color: var(--text-muted);
    }

    .input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      border: none;
      outline: none;
      background: var(--bg-input);
      color: var(--text-main);
    }

    .btn {
      width: 100%;
      padding: 10px;
      margin-top: 12px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.3s;
      font-weight: bold;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--primary);
      color: white;
    }

    .btn-outline:hover {
      background: var(--primary);
    }

    .divider {
      margin: 15px 0;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>

<body>
  <h1>BusTrack</h1>
  <p>Real-Time Commuter Bus Information System</p>
  <div class="badge">Deployed via GitHub Pages</div>
  <div class="card">
    <h1 class="title">NaaBus?</h1>
    <p class="subtitle">Real-Time Commuter Bus Information System</p>

    <form id="loginForm">
      <input class="input" id="username" type="text" placeholder="Username" required />
      <input class="input" id="password" type="password" placeholder="Password" required />
      <button class="btn btn-primary" type="submit">Login</button>
    </form>

    <div class="divider">or</div>

    <button id="guestBtn" class="btn btn-outline">
      Continue as Guest
    </button>
  </div>

  <script>
    // =========================
    // PERFORMANCE MONITORING
    // =========================
    const perfStart = performance.now();

    window.addEventListener("load", () => {
      const loadTime = performance.now() - perfStart;
      console.log("Page Load Time:", loadTime.toFixed(2), "ms");

      if (performance.memory) {
        console.log("Memory Usage:", {
          usedJSHeapSize: (performance.memory.usedJSHeapSize / 1048576).toFixed(2) + " MB",
          totalJSHeapSize: (performance.memory.totalJSHeapSize / 1048576).toFixed(2) + " MB"
        });
      }
    });

    // =========================
    // EVENT HANDLERS
    // =========================
    const loginForm = document.getElementById("loginForm");
    const guestBtn = document.getElementById("guestBtn");

    function handleLogin(event) {
      event.preventDefault();

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      console.time("Login Process");

      // Simulated API call
      setTimeout(() => {
        console.timeEnd("Login Process");
        alert(`Welcome, ${username}`);
        window.location.href = "dashboard.html";
      }, 500);
    }

    function handleGuestContinue() {
      console.time("Guest प्रवेश"); // just a label for timing
      window.location.href = "dashboard.html";
      console.timeEnd("Guest प्रवेश");
    }

    loginForm.addEventListener("submit", handleLogin);
    guestBtn.addEventListener("click", handleGuestContinue);

    // =========================
    // API / ENDPOINT TIMING WRAPPER
    // =========================
    async function measureFetch(url) {
      const start = performance.now();

      const response = await fetch(url);
      const data = await response.json();

      const end = performance.now();
      console.log(`API Call to ${url}: ${(end - start).toFixed(2)} ms`);

      return data;
    }
  </script>
</body>
</html>
